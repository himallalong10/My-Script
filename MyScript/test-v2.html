<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyScript v2.0 Test Lab</title>

    <style>
        body {
            background: #10141c;
            color: #e8edf5;
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            color: #55c8ff;
        }

        textarea {
            width: 100%;
            height: 230px;
            background: #1a2230;
            color: #e8edf5;
            border: 1px solid #39465c;
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
            font-family: Consolas, monospace;
            font-size: 15px;
        }

        button {
            background: #1687ff;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            margin-top: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #0067d9;
        }

        pre {
            background: #080b10;
            color: #71f5a4;
            border: 1px solid #39465c;
            border-radius: 8px;
            padding: 16px;
            min-height: 100px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .error {
            color: #ff7777;
        }
    </style>
</head>

<body>

    <h1>MyScript v2.0.0</h1>

    <p>AST Execution Engine Test Lab</p>

    <textarea id="codeEditor">LET age = 20
LET result = age + 5 * 2

PRINT "MyScript v2.0"
PRINT result
PRINT (10 + 5) * 2</textarea>

    <br>

    <button id="runButton">▶ Run MyScript</button>

    <h2>Output</h2>

    <pre id="output">Ready to execute.</pre>

    <script src="lexer.js"></script>
    <script src="ast.js"></script>
    <script src="parser.js"></script>
    <script src="ast-interpreter.js"></script>

    <script>
        const editor = document.getElementById("codeEditor");
        const output = document.getElementById("output");
        const button = document.getElementById("runButton");

        button.addEventListener("click", function () {

            try {

                const source = editor.value;

                const lexer = new MyScriptLexer(source);
                const tokens = lexer.tokenize();

                const parser = new MyScriptParser(tokens);
                const ast = parser.parse();

                const interpreter = new MyScriptASTInterpreter();

                output.className = "";
                output.textContent = interpreter.run(ast);

            } catch (error) {

                output.className = "error";
                output.textContent = "ERROR: " + error.message;

                console.error(error);
            }
        });
    </script>

</body>
</html>
